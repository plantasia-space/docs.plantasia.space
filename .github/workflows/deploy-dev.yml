name: Deploy dev docs

# The docs `dev` branch → xplorer-docs.plantasia.space, so dev-root (and its Orchidea) reads the docs
# not yet promoted. The public docs stay on `main` → GitHub Pages (deploy.yml).
# Same path as the services: SSH to the dev box with the be-deploy CI key, which is locked
# (forced-command) to `deploy <repo> dev [run_id] [run_url]` — see plantasia-space-org/be-deploy.
# For `xplorer-docs` it runs deploy/dev-site.sh under the pipeline lock. Setup: deploy/README.md.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: be-deploy-xplorer-docs-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger deploy on dev box
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "deploy xplorer-docs dev ${{ github.run_id }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
