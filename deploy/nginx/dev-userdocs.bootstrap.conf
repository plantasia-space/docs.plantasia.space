# First step for dev-userdocs.plantasia.space: HTTP only, so Certbot's HTTP-01 challenge can pass.
# Once the cert is issued, replace this file with dev-userdocs.plantasia.space.conf and reload.

server {
    listen 80;
    server_name dev-userdocs.plantasia.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
