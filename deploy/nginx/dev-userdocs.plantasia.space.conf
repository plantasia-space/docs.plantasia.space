# dev-userdocs.plantasia.space: the docs `dev` branch, built by deploy/dev-site.sh, served by the dev
# box's nginx. Open like the public docs (dev-root's Orchidea and mycelium read its pages), but kept
# out of search engines.

server {
    listen 80;
    server_name dev-userdocs.plantasia.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dev-userdocs.plantasia.space;

    ssl_certificate     /etc/letsencrypt/live/dev-userdocs.plantasia.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev-userdocs.plantasia.space/privkey.pem;   # managed by Certbot

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Environment "Development" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    root /srv/dev-userdocs.plantasia.space/deploy/site;
    index index.html;

    # Docusaurus writes one index.html per route; a missing page is its own 404 page, with a 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
